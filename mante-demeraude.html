<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mante d'Émeraude — Cosmos Community</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&family=Oswald:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --intranet-color: #10b981; /* Emerald green */
      --bg-deep: #0a0f0d;
      --card-bg: rgba(16, 24, 20, 0.75);
      --card-border: rgba(16, 185, 129, 0.25);
      --text-muted: #6b7c72;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      font-family: 'Kanit', system-ui, -apple-system, sans-serif;
      background-color: var(--bg-deep);
      color: #e8f0ec;
      overflow: hidden;
      position: relative;
    }

    /* Subtle grid background */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(16, 185, 129, 0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(16, 185, 129, 0.03) 1px, transparent 1px);
      background-size: 48px 48px;
      pointer-events: none;
      z-index: 0;
    }

    /* Soft emerald glow */
    body::after {
      content: "";
      position: fixed;
      top: 50%;
      left: 50%;
      width: 600px;
      height: 600px;
      transform: translate(-50%, -50%);
      background: radial-gradient(circle, rgba(16, 185, 129, 0.12) 0%, transparent 70%);
      pointer-events: none;
      z-index: 0;
    }

    .page {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 1.5rem;
      position: relative;
      z-index: 1;
    }

    .card {
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--card-border);
      border-radius: 1rem;
      padding: 2rem;
      max-width: 22rem;
      width: 100%;
      text-align: center;
      box-shadow:
        0 0 0 1px rgba(16, 185, 129, 0.08),
        0 20px 50px -20px rgba(0, 0, 0, 0.6),
        0 0 40px -10px rgba(16, 185, 129, 0.15);
    }

    .emblem {
      width: 56px;
      height: 56px;
      margin: 0 auto 1.25rem;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      background: linear-gradient(145deg, rgba(16, 185, 129, 0.2), rgba(5, 150, 105, 0.1));
      border: 1px solid rgba(16, 185, 129, 0.35);
      box-shadow: 0 0 20px rgba(16, 185, 129, 0.2);
    }

    .emblem svg {
      width: 32px;
      height: 32px;
      fill: #34d399;
    }

    h1 {
      font-family: 'Oswald', 'Kanit', sans-serif;
      font-size: 1.5rem;
      font-weight: 600;
      letter-spacing: 0.02em;
      color: #ffffff;
      margin-bottom: 0.25rem;
    }

    .subtitle {
      font-size: 0.875rem;
      color: var(--text-muted);
      margin-bottom: 1.75rem;
      font-weight: 400;
    }

    .btn-primary {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      padding: 0.75rem 1.25rem;
      font-family: 'Kanit', sans-serif;
      font-size: 0.95rem;
      font-weight: 500;
      color: #ffffff;
      background: linear-gradient(135deg, #059669, #10b981);
      border: none;
      border-radius: 0.625rem;
      cursor: pointer;
      text-decoration: none;
      transition: all 0.2s ease;
      box-shadow:
        0 4px 14px rgba(16, 185, 129, 0.35),
        inset 0 1px 0 rgba(255, 255, 255, 0.15);
    }

    .btn-primary:hover {
      background: linear-gradient(135deg, #047857, #059669);
      transform: translateY(-1px);
      box-shadow:
        0 6px 20px rgba(16, 185, 129, 0.45),
        inset 0 1px 0 rgba(255, 255, 255, 0.15);
    }

    .btn-primary:active {
      transform: translateY(0);
    }

    .footer-note {
      margin-top: 1.5rem;
      font-size: 0.7rem;
      color: #4a5c52;
      letter-spacing: 0.03em;
    }

    /* Small decorative clover */
    .clover {
      position: absolute;
      opacity: 0.04;
      pointer-events: none;
    }

    .clover-1 {
      top: 12%;
      left: 8%;
      width: 80px;
      transform: rotate(-15deg);
    }

    .clover-2 {
      bottom: 15%;
      right: 10%;
      width: 60px;
      transform: rotate(25deg);
    }
  </style>
</head>
<body>
  <!-- Decorative clovers -->
  <svg class="clover clover-1" viewBox="0 0 100 100" fill="#10b981">
    <path d="M50 20c-8 0-14 6-14 14 0 4 2 8 5 10-6 2-10 8-10 14 0 8 6 14 14 14 4 0 7-1 10-4 3 3 6 4 10 4 8 0 14-6 14-14 0-6-4-12-10-14 3-2 5-6 5-10 0-8-6-14-14-14-4 0-7 1-10 4-3-3-6-4-10-4z"/>
  </svg>
  <svg class="clover clover-2" viewBox="0 0 100 100" fill="#10b981">
    <path d="M50 20c-8 0-14 6-14 14 0 4 2 8 5 10-6 2-10 8-10 14 0 8 6 14 14 14 4 0 7-1 10-4 3 3 6 4 10 4 8 0 14-6 14-14 0-6-4-12-10-14 3-2 5-6 5-10 0-8-6-14-14-14-4 0-7 1-10 4-3-3-6-4-10-4z"/>
  </svg>

  <div class="page">
    <div class="card">
      <div class="emblem">
        <!-- Clover + Slash -->
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path fill="#34d399" d="M12 3c-1.8 0-3.2 1.4-3.2 3.2 0 .9.4 1.7 1 2.3-1.4.5-2.4 1.9-2.4 3.5 0 2 1.6 3.6 3.6 3.6.9 0 1.7-.3 2.3-.8.6.5 1.4.8 2.3.8 2 0 3.6-1.6 3.6-3.6 0-1.6-1-3-2.4-3.5.6-.6 1-1.4 1-2.3C15.2 4.4 13.8 3 12 3z"/>
          <path fill="none" stroke="#34d399" stroke-width="1.8" stroke-linecap="round" d="M8 16l8 5"/>
          <path fill="none" stroke="#34d399" stroke-width="1.8" stroke-linecap="round" d="M16 16l-8 5"/>
        </svg>
      </div>

      <h1>Mante d'Émeraude</h1>
      <p class="subtitle">Tranchez l'impossible</p>

      <a href="/login" class="btn-primary">
        Se connecter avec Steam
      </a>

      <p class="footer-note">Compagnie des Chevaliers-Mages · Royaume de Clover</p>
    </div>
  </div>
</body>
</html>
